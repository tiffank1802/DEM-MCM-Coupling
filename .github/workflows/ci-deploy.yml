name: CI & Deploy

on:
  push:
    branches:
      - master
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Force GitHub Pages deployment"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: "ci-deploy-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ci:
    name: Rust (fmt, clippy, 39 tests, egui check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & targets
        uses: Swatinem/rust-cache@v2

      - name: Install X11/OpenGL headers for gui-egui check
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libgl-dev libwayland-dev pkg-config

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run full Rust test suite (--release)
        run: cargo test --release

      - name: Verify egui frontend compilation
        run: cargo check --manifest-path gui-egui/Cargo.toml

      - name: Build & validate CLI against real DEM chunks
        run: |
          cargo build --release --bin dem-mcm-sweep --bin dem-mcm-gui
          ./target/release/dem-mcm-sweep --validate ./data/chunks

  python-ci:
    name: Python (pytest suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install headless OpenGL/X11 libs for PyVista/VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libxrender1

      - name: Install dependencies (CPU PyTorch + viz + pyvista + seaborn + dev)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,viz,hf]" pyvista seaborn

      - name: Run pytest suite
        run: pytest -v

  build-artifacts:
    name: Build binaries & Python package (${{ matrix.os }})
    needs: [rust-ci, python-ci]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            ext: ""
          - os: macos-latest
            target: macos-arm64
            ext: ""
          - os: windows-latest
            target: windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo registry & targets
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bin dem-mcm-sweep --bin dem-mcm-gui

      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-bin
          cp target/release/dem-mcm-sweep dist-bin/
          cp target/release/dem-mcm-gui dist-bin/
          cp README.md LICENSE docs/ARCHITECTURE_EGUI.md dist-bin/
          tar -czf "dem-mcm-coupling-${{ matrix.target }}.tar.gz" -C dist-bin .

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-bin | Out-Null
          Copy-Item target/release/dem-mcm-sweep.exe dist-bin/
          Copy-Item target/release/dem-mcm-gui.exe dist-bin/
          Copy-Item README.md, LICENSE, docs/ARCHITECTURE_EGUI.md dist-bin/
          Compress-Archive -Path dist-bin/* -DestinationPath "dem-mcm-coupling-${{ matrix.target }}.zip"

      - name: Build Python sdist & wheel
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dem-mcm-coupling-${{ matrix.target }}.*

      - name: Upload Python distributions
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-pages:
    name: Build static 3D Studio for GitHub Pages
    needs: [rust-ci, python-ci]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo registry & targets
        uses: Swatinem/rust-cache@v2

      - name: Build & export static 3D Studio (_site)
        run: |
          cargo build --release --bin dem-mcm-gui
          ./target/release/dem-mcm-gui --export-static _site --data-dir ./data/chunks
          ls -lh _site _site/static_data

      - name: Upload static site bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-3d-static-site
          path: _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy-pages:
    name: Deploy 3D Studio to GitHub Pages
    needs: build-pages
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || inputs.deploy_pages == true)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable & configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-docker:
    name: Build & Push Docker image to GHCR
    needs: [rust-ci, python-ci]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-release:
    name: Publish GitHub Release
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release archives
        run: |
          mkdir -p final-assets
          find release-assets -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.whl" \) -exec cp {} final-assets/ \;
          ls -lh final-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-assets/*
          generate_release_notes: true
